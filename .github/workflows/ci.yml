name: Validate Reports Visualizer

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
        output: [export, standalone]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          NEXT_OUTPUT: ${{ matrix.output }}
      - name: Verify deployment output
        env:
          NEXT_OUTPUT: ${{ matrix.output }}
        run: |
          if [[ "$NEXT_OUTPUT" == "standalone" ]]; then
            test -f .next/standalone/server.js
          else
            test -f out/index.html
          fi

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: githubreportsvisualizer:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start container
        id: container
        run: docker run --detach --name billing-preview --publish 3118:3000 githubreportsvisualizer:test
      - name: Verify container response
        run: curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:3118/
      - name: Container logs
        if: ${{ failure() && steps.container.outcome == 'success' }}
        run: docker logs billing-preview
      - name: Stop container
        if: ${{ always() && steps.container.outcome == 'success' }}
        run: docker rm --force billing-preview

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
